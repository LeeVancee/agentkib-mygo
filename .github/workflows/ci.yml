name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/mygo-host/go.mod
          cache-dependency-path: apps/desktop/mygo-host/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose Linux build environment
        run: apps/desktop/scripts/diagnose-linux.sh --strict

      - name: Check formatting
        run: pnpm format:check

      - name: Lint desktop and backend
        run: pnpm lint

      - name: Test frontend
        run: pnpm test

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Build hosted Web
        run: pnpm build:web:hosted
