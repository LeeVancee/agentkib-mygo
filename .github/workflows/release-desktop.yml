name: Desktop Package Artifacts

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and publish; leave empty for artifact-only builds"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate and test selected revision
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/mygo-host/go.mod
          cache-dependency-path: apps/desktop/mygo-host/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/package.json')).version")
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid desktop version: $package_version" >&2
            exit 1
          fi
          echo "app_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Validate release ref
        id: release
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REQUESTED_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          release_tag="$PUSHED_TAG"
          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ -n "$release_tag" && "$release_tag" != "$REQUESTED_TAG" ]]; then
              echo "Selected ref tag $release_tag does not match requested tag $REQUESTED_TAG" >&2
              exit 1
            fi
            release_tag="$REQUESTED_TAG"
          fi
          release_sha=$(git rev-parse 'HEAD^{commit}')
          should_publish=false
          if [[ -n "$release_tag" ]]; then
            expected_tag="v$APP_VERSION"
            [[ "$release_tag" == "$expected_tag" ]] || {
              echo "Release tag $release_tag does not match desktop version $APP_VERSION; expected $expected_tag" >&2
              exit 1
            }
            tag_sha=$(git rev-list -n 1 "$release_tag")
            [[ "$tag_sha" == "$release_sha" ]] || {
              echo "Release tag $release_tag resolves to $tag_sha, but checkout resolved to $release_sha" >&2
              exit 1
            }
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            git merge-base --is-ancestor "$release_sha" origin/main || {
              echo "Release commit $release_sha is not contained in origin/main" >&2
              exit 1
            }
            should_publish=true
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: pnpm format:check

      - name: Lint desktop and backend
        run: pnpm lint

      - name: Test frontend
        run: pnpm test

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build React renderer
        run: pnpm --filter @agentkib/desktop build:web

  desktop:
    name: Build ${{ matrix.name }} ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            arch: arm64
            os: macos-14
            artifact: macos-arm64
          - name: Windows
            arch: x64
            os: windows-2022
            artifact: windows-x64
          - name: Ubuntu
            arch: x64
            os: ubuntu-24.04
            artifact: linux-ubuntu-x64
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils curl file pkg-config patchelf libssl-dev \
            libgtk-3-dev libfuse2 libglib2.0-bin desktop-file-utils \
            xdg-utils dbus-x11 xvfb

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/mygo-host/go.mod
          cache-dependency-path: apps/desktop/mygo-host/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wails preview binary
        run: pnpm --filter @agentkib/desktop wails:build

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentkib-desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/mygo-host/build/AgentKib*

  fedora-x64:
    name: Build Fedora x64 RPM
    needs: preflight
    runs-on: ubuntu-24.04
    container: fedora:42
    env:
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            git curl tar gzip xz file findutils which binutils \
            gcc gcc-c++ make libatomic openssl-devel pkgconf-pkg-config patchelf \
            gtk3-devel rpm-build desktop-file-utils xdg-utils dbus-daemon \
            xorg-x11-server-Xvfb util-linux

      - name: Check out selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).packageManager.replace(/^pnpm@/, '')")
          npm install --global "pnpm@$pnpm_version"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/mygo-host/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wails Linux preview binary
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pnpm --filter @agentkib/desktop wails:build

      - name: Build RPM package
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$PWD/apps/desktop/mygo-host/build"
          rpm_root="$PWD/rpmroot"
          release_dir="$PWD/dist/desktop-release"
          test -x "$source_dir/AgentKib"
          rm -rf "$rpm_root" "$release_dir"
          mkdir -p "$rpm_root"/{BUILD,RPMS,SOURCES,SPECS,SRPMS} "$release_dir"
          cat > "$rpm_root/SPECS/agentkib.spec" <<EOF_SPEC
          %global __brp_strip %{nil}
          %global __brp_strip_comment_note %{nil}
          %global __brp_strip_lto %{nil}
          %global __brp_strip_static_archive %{nil}
          Name: agentkib
          Version: $APP_VERSION
          Release: 1%{?dist}
          Summary: AgentKib desktop application
          License: Proprietary
          BuildArch: x86_64
          %description
          Discover, diagnose, and synchronize coding agent configuration.
          %install
          mkdir -p %{buildroot}/opt/agentkib
          install -m 0755 $source_dir/AgentKib %{buildroot}/opt/agentkib/agentkib
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/share/applications
          ln -s /opt/agentkib/agentkib %{buildroot}/usr/bin/agentkib
          cat > %{buildroot}/usr/share/applications/agentkib.desktop <<EOF_DESKTOP
          [Desktop Entry]
          Name=AgentKib
          Exec=/usr/bin/agentkib
          Type=Application
          Categories=Development;
          EOF_DESKTOP
          %files
          /opt/agentkib
          /usr/bin/agentkib
          /usr/share/applications/agentkib.desktop
          EOF_SPEC
          rpmbuild --define "_topdir $rpm_root" -bb "$rpm_root/SPECS/agentkib.spec"
          cp "$rpm_root/RPMS/x86_64/"*.rpm "$release_dir/"

      - name: Upload Fedora RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentkib-desktop-linux-fedora-x64
          if-no-files-found: error
          path: dist/desktop-release/*.rpm

  publish-release:
    name: Publish GitHub Release
    needs:
      - preflight
      - desktop
      - fedora-x64
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_DIR: release-artifacts
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: agentkib-desktop-*
          path: ${{ env.RELEASE_DIR }}
          merge-multiple: true

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          count=$(find "$RELEASE_DIR" -type f | wc -l | tr -d ' ')
          if [[ "$count" -eq 0 ]]; then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          find "$RELEASE_DIR" -type f -size +0c -print

      - name: Create or update draft release
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "AgentKib $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Upload release artifacts
        shell: bash
        run: |
          find "$RELEASE_DIR" -type f -print0 |
            xargs -0 gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
