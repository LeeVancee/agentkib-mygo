name: Desktop MyGo packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            platform: darwin/arm64,darwin/amd64
            artifact: agentkib-macos
          - name: Windows
            os: ubuntu-24.04
            platform: windows/amd64
            artifact: agentkib-windows
          - name: Linux
            os: ubuntu-24.04
            platform: linux/amd64
            artifact: agentkib-linux

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/mygo-host/go.mod
          cache-dependency-path: apps/desktop/mygo-host/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NSIS for Windows packages
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build the React renderer
        run: pnpm --filter @agentkib/desktop build:web

      - name: Build the TypeScript backend
        run: pnpm --filter @agentkib/desktop backend:build

      - name: Stage MyGo quota resources
        run: pnpm --filter @agentkib/desktop mygo:quota:stage

      - name: Build MyGo packages
        working-directory: apps/desktop
        run: >-
          go run github.com/egoist/mygo/cmd/mygo@v0.4.0 build
          -platform "${{ matrix.platform }}"
          ./mygo-host

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/mygo-host/build/*/*.dmg
            apps/desktop/mygo-host/build/*/*Setup*.exe
            apps/desktop/mygo-host/build/*/*.deb
            apps/desktop/mygo-host/build/*/*.tar.gz
            apps/desktop/mygo-host/build/*/install.sh

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

          find release-artifacts -type f -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
