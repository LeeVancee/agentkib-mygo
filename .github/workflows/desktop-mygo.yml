name: Desktop Wails preview builds

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            artifact: agentkib-macos-arm64
          - name: Windows x64
            os: windows-2022
            artifact: agentkib-windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            artifact: agentkib-linux-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/mygo-host/go.mod
          cache-dependency-path: apps/desktop/mygo-host/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Wails preview binary
        run: pnpm --filter @agentkib/desktop wails:build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/mygo-host/build/AgentKib*

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

          find release-artifacts -type f -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
