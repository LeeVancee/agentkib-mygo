name: Windows TypeScript Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-arm64:
    name: Typecheck on Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: arm64
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build backend and stage native bindings
        run: pnpm --filter @agentkib/desktop backend:build
      - name: Test backend workers, native bindings and MCP ownership
        # Each fixture starts real backend workers; avoid oversubscribing the runner.
        # Allow Windows integration startup time; explicit deadlines and latency assertions remain.
        run: pnpm test:backend:stability --maxWorkers=1 --testTimeout=15000

  typecheck:
    name: Typecheck on Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build backend and stage native bindings
        run: pnpm --filter @agentkib/desktop backend:build
      - name: Test backend workers, native bindings and MCP ownership
        # Allow Windows integration startup time; explicit deadlines and latency assertions remain.
        run: pnpm test:backend:stability --maxWorkers=1 --testTimeout=15000
